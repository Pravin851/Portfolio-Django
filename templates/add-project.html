<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/experience.css' %}">
</head>
<body>
    <div>
        <h1>Projects</h1>
        <form action="{% url 'projects' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <table>
                <tr>
                    <td><label for="username">User</label></td>
                    <td><input type="text" name="username" id="username"></td>
                </tr>
                <tr>
                    <td><label for="id_title">Title</label></td>
                    <td><input type="text" name="title" id="id_title"></td>
                </tr>
                <tr>
                    <td><label for="id_description">Description</label></td>
                    <td><textarea name="description" id="id_description"></textarea></td>
                </tr>
                <tr>
                    <td><label for="id_link">Link</label></td>
                    <td><input type="url" name="link" id="id_link"></td>
                </tr>
            </table>
            <button type="submit">Submit</button>
    </div>
    
</body>
</html>
